stages:
  - int-test

# Use resource_group as tests use the simulator so they can't run in parallel.
# See https://gitlab.com/gitlab-org/gitlab/issues/15536 for future support of locks.
.common:
  stage: int-test
  resource_group: "ios-simulator"
  tags:
    - xcode
    - mac

# Test Swift Package releases (uses Swift Package Manager)
# See docs/release-checklist.md in the objectbox-swift repo on how to create a release.
swiftpm:
  extends: .common
  variables:
    OBX_SWIFT_FLAGS: "-DOBJECTBOX_SYNC_OFF"
  script:
    - ./test.sh --clean --swiftpm --version 6.0.0-rc

swiftpm-sync:
  extends: .common
  variables:
    OBX_SWIFT_FLAGS: "-DOBJECTBOX_SYNC_ON"
  script:
    - ./test.sh --clean --swiftpm --version 6.0.0-rc --sync

# Test the Swift Package preview: the "staging" branch of objectbox-swift-spm (previews are branches, not tags; a good
# preview is promoted by tagging its commit). Currently 6.0.0-rc (both variants); see docs/mesh-sync.md and
# docs/release-checklist.md in the objectbox-swift repo.
swiftpm-staging:
  extends: .common
  variables:
    OBX_SWIFT_FLAGS: "-DOBJECTBOX_SYNC_ON"
  script:
    - ./test.sh --clean --swiftpm --version staging --sync --meshsync
    # The regular variant of the preview
    - OBX_SWIFT_FLAGS="-DOBJECTBOX_SYNC_OFF" ./test.sh --clean --swiftpm --version staging

# Test CocoaPods releases
# See docs/release-checklist.md in the objectbox-swift repo on how to create a staging release.
# Note: hide the job by prefixing it with a dot, enable it (remove the dot) when testing new staging releases
cocoapods-staging:
  extends: .common
  script:
    - OBX_SWIFT_FLAGS="-DOBJECTBOX_SYNC_OFF" ./test.sh --clean --staging --version 6.0.0-rc
    # Optional: test Sync preview release
    - OBX_SWIFT_FLAGS="-DOBJECTBOX_SYNC_ON" ./test.sh --clean --staging --version 6.0.0-rc-sync

cocoapods-latest:
  extends: .common
  variables:
    OBX_SWIFT_FLAGS: "-DOBJECTBOX_SYNC_OFF"
  script:
    # Run once without version to check if the latest version is found (then verify log output)
    # These tests take a long time on our current runner, so test no version only on CircleCI
    # - ./test.sh --clean
    - ./test.sh --clean --version 6.0.0-rc

cocoapods-sync-latest:
  extends: .common
  variables:
    OBX_SWIFT_FLAGS: "-DOBJECTBOX_SYNC_ON"
  script:
    - ./test.sh --clean --version 6.0.0-rc-sync

